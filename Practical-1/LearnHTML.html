<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Grid Example</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Container: centers and adds padding -->
  <div class="container">
    <h1 class="text-center my-4">Bootstrap 12 Column Grid</h1>

    <!-- Row: groups columns -->
    <div class="row">
      <!-- Each col takes up 4/12 columns (so 3 fit per row) -->
      <div class="col-4 bg-primary text-white text-center p-3">Column 1</div>
      <div class="col-4 bg-success text-white text-center p-3">Column 2</div>
      <div class="col-4 bg-danger text-white text-center p-3">Column 3</div>
    </div>

    <!-- Another row with different column sizes -->
    <div class="row mt-4">
      <div class="col-3">A</div>
      <div class="col-md-3">A</div>
      <div class="col-md-3">A</div>
      <div class="col-6 bg-warning text-dark text-center p-3">Column 1 (6/12)</div>
      <div class="col-3 bg-info text-dark text-center p-3">Column 2 (3/12)</div>
      <div class="col-3 bg-secondary text-white text-center p-3">Column 3 (3/12)</div>
    </div>

    <!-- Flexbox utilities -->
    <h2 class="mt-5">Flexbox Example</h2>
    <div class="d-flex justify-content-around bg-light p-3">
      <div class="p-2 bg-primary text-white">Flex Item 1</div>
      <div class="p-2 bg-success text-white">Flex Item 2</div>
      <div class="p-2 bg-danger text-white">Flex Item 3</div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
          crossorigin="anonymous"></script>
</body>
</html>
