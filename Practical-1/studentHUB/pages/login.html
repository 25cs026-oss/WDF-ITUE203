<!DOCTYPE html>
<html lang="en">
  <!-- This file builds one page of the StudentHub website. Comments explain each major HTML section. -->
  <head>
    <!-- The head contains page settings that the browser reads before showing content. -->
    <!-- UTF-8 supports most characters and symbols used on modern websites. -->
    <meta charset="UTF-8" />
    <!-- The viewport tag makes the layout scale correctly on phones, tablets, and desktops. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title appears in the browser tab and helps identify the page. -->
    <title>Login - StudentHub</title>
    <!-- This connects the shared CSS file so this page uses the site design. -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <!-- Visible page content starts inside the body. -->
    <!-- Header: top navigation area shown across the site. -->
    <header class="site-header">
      <!-- Brand link returns users to the StudentHub home page. -->
      <a class="brand" href="../home.html">StudentHub</a>
      <!-- Navigation groups links to related pages. -->
      <nav>
        <a href="features.html">Features</a>
        <a href="about.html">About</a>
        <a href="contact-help.html">Contact/Help</a>
      </nav>
    </header>

    <!-- Main contains the unique content for this page. -->
    <main class="page">
      <!-- Hero section introduces the page with a label, heading, and short description. -->
      <section class="hero">
        <p class="eyebrow">Choose Role</p>
        <h1>Login</h1>
        <p>Select a dashboard to continue into the portal wireframe.</p>
      </section>

      <!-- Grid section arranges important links as responsive cards. -->
      <section class="grid">
        <a class="card" href="student/dashboard.html">Student Dashboard</a>
        <a class="card" href="faculty/dashboard.html">Faculty Dashboard</a>
        <a class="card" href="admin/dashboard.html">Admin Dashboard</a>
      </section>
    </main>

    <!-- JavaScript is loaded at the end so the HTML appears before scripts run. -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
