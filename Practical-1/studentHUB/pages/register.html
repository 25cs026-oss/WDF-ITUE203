<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StudentHub</title>
</head>
<body>

  <header>
    <a href="../home.html">StudentHub</a>

    <nav>
      <a href="features.html">Features</a>
      <a href="about.html">About</a>
      <a href="contact-help.html">Contact/Help</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <h1>Student Registration</h1>
    <p>Fill in the details below to create your account.</p>

    <form action="login.html">
      <label for="fullname">Full Name</label><br>
      <input type="text" id="fullname" name="fullname" required><br><br>

      <label for="enrollment">Enrollment Number</label><br>
      <input type="text" id="enrollment" name="enrollment" required><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password" required><br><br>

      <label for="confirm-password">Confirm Password</label><br>
      <input type="password" id="confirm-password" name="confirm-password" required><br><br>

      <button type="submit">Register</button>
    </form>

    <p>Already registered? <a href="login.html">Login here</a></p>
  </main>

  <footer>
    <p>StudentHub Portal</p>
    <p>Email: support@studenthub.com</p>
    <p>Contact Admin: admin@studenthub.com</p>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

</body>
</html>
